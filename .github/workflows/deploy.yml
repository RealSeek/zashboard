name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        font:
          - { key: all, suffix: '' }
          - { key: cdn, suffix: '-cdn-fonts' }
          - { key: firasans, suffix: '-firasans-only' }
          - { key: misans, suffix: '-misans-only' }
          - { key: pingfang, suffix: '-pingfang-only' }
          - { key: sarasa, suffix: '-sarasa-only' }
          - { key: none, suffix: '-no-fonts' }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build
        env:
          FONT: ${{ matrix.font.key }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          zip -r dist${{ matrix.font.suffix }}.zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.font.key }}
          path: dist${{ matrix.font.suffix }}.zip

      - name: Publish built files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages${{ matrix.font.suffix }}
          force_orphan: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          printf 'Automatically built from main commit `%s`. Updated on every push to main.\n' "$BUILD_SHA" > release-notes.md
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$BUILD_SHA" -F force=true
            gh release edit latest --title 'Latest build' --notes-file release-notes.md --latest
          else
            gh release create latest --target "$BUILD_SHA" --title 'Latest build' --notes-file release-notes.md --latest
          fi
          gh release upload latest release/dist*.zip --clobber
